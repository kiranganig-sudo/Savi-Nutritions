{% extends "base.html" %}
{% block title %}{{ module_title }}{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <div class="breadcrumb"><a href="{{ url_for('dashboard') }}">Home</a> <i class="fas fa-chevron-right"></i> <span>{{ module_title }}</span></div>
        <h1 class="page-title">{{ module_title }}</h1>
    </div>
</div>

<div class="card module-placeholder-card">
    <div class="card-body empty-state">
        <i class="fas fa-plug-circle-exclamation"></i>
        <h2>{{ module_title }}</h2>
        <p>{{ module_description }}</p>
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>
</div>
{% endblock %}

{% if u.password_plain %}
<span class="pw-reveal">
    <code class="pw-dots" aria-hidden="true">&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;</code>
    <code class="pw-plain" style="display:none;">{{ u.password_plain }}</code>
    <button type="button" class="pw-eye" aria-label="Show password" title="Show password">
        <i class="fas fa-eye"></i>
    </button>
</span>
{% else %}
<span style="color:#8a938d;">&mdash;</span>
{% endif %}
